plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def releaseSigning = [
    storeFile: System.getenv("KTV_STORE_FILE"),
    storePassword: System.getenv("KTV_STORE_PASSWORD"),
    keyAlias: System.getenv("KTV_KEY_ALIAS"),
    keyPassword: System.getenv("KTV_KEY_PASSWORD")
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace "com.local.ktv.issuer"
    compileSdk 35
    defaultConfig {
        applicationId "com.local.ktv.offlineissuer"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "2.1.0"
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}
